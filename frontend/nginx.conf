server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Only relevant for local `docker compose` (frontend + api share that
    # network and "api" resolves via Docker's embedded DNS). On Render (and
    # anywhere else the frontend runs as a standalone container) VITE_API_URL
    # is baked in at build time and the JS calls the backend's absolute URL
    # directly — these proxy blocks are simply never hit, so "api" never
    # needs to resolve.
    #
    # proxy_pass MUST use a variable here (not a literal http://api:8080)
    # so nginx defers DNS resolution to request time instead of resolving it
    # once at config-load/startup. With a literal target, nginx refuses to
    # start at all if "api" doesn't resolve — which is exactly what happens
    # as a standalone Render service, since there's no such host anywhere.
    resolver 127.0.0.11 valid=10s;
    set $upstream_api http://api:8080;

    # SPA fallback — all unknown routes serve index.html so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the Go backend container.
    location /api/ {
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE needs buffering disabled.
        proxy_buffering off;
        proxy_cache off;
    }

    location /callbacks/ {
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass $upstream_api;
    }
}
